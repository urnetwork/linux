name: Beta Build - Linux

# =============================================================================
# THE RELEASE CONTRACT
#
# This workflow is the Linux half of the fork's beta line. It mirrors
# urnetwork-windows/.github/workflows/beta-build.yml deliberately and
# literally, because the two lines share ONE version identity (the same
# scheme the android and apple beta lines use) and because the in-app
# checkers on both platforms parse the same shape of release JSON.
#
# 1. VERSION
#      version = "$(date -u +%Y.%-m.%-d)-<code>-beta"
#      code    = (epoch(run.created_at) - epoch(2023-05-23)) * 10
#    Derived ONCE, in the build-sdk job, from THIS RUN's created_at (read back
#    through the actions API) -- never from `date` at step time -- so every job
#    of one run agrees even when the run straddles midnight UTC. Job outputs
#    are the only channel that crosses job boundaries, so it is re-exported
#    from build-sdk and consumed by every later job.
#
#    Windows additionally derives version_major/minor/patch (VERSIONINFO's
#    16-bit numeric fields) and msi_version (the MSI's 8-bit ProductVersion).
#    Neither has a Linux analogue -- a .deb and an AppImage carry the full
#    string -- so those outputs are deliberately absent here. The `version`
#    math itself is byte-identical to the Windows step.
#
# 2. TAG + RELEASE
#      tag "v${VERSION}", published as a PRERELEASE, `--target $GITHUB_SHA`
#      (so the tag pins the commit this run built, not wherever the default
#      branch drifted), and the tag's existing release is DELETED first so a
#      re-run replaces rather than collides.
#      Notes lead line, verbatim and shared with Windows:
#        "Beta build (custom server fork) riding the official version
#         numbering -- this is not an official URnetwork release."
#
# 3. PULL REQUESTS BUILD, BUT NEVER PUBLISH. A PR that republished (and first
#    DELETED) the day's release would be a footgun even before fork PRs'
#    read-only tokens made it fail halfway.
#
# 4. ASSET NAMES ARE A CONTRACT, NOT COSMETICS.
#    The in-app service installer/updater and the GUI updater parse them out
#    of the releases JSON, match on the running architecture, and pair the
#    download URL with the sha256 GitHub computed for that same asset object.
#    The names below are the MIGRATION.md normative names -- the packaging
#    scripts produce exactly these, so the name is decided by the script, not
#    by this workflow, and neither may drift from the other.
#
#      urnetwork-daemon-<version>-<arch>.install.tar.gz
#          THE SERVICE. This is what the Connect page's "install/update the
#          service" button downloads, verifies unprivileged in the sandbox,
#          and only then hands to pkexec. Flatpak and AppImage ship the UI
#          only; this asset is the whole service channel.
#      urnetwork-daemon_<version>_<arch>.deb
#          The native channel for humans and for apt-style installs. NOT
#          parsed by the in-app checker; attached because MIGRATION.md names
#          it and because a release that ships only a tarball has no answer
#          for Debian/Ubuntu users.
#      urnetwork-daemon-<rpm version>-<rpm release>.<rpmarch>.rpm
#          The SAME daemon payload for the Fedora/RHEL/openSUSE half of
#          "universal across Linux distros" -- built in the same job, from the
#          same `meson install --destdir` staging tree, through the same
#          packaging/lib/common.sh assemble_daemon_root, so it CANNOT drift
#          from the .deb or the tarball. Not parsed by the in-app checker.
#
#          ITS EXACT NAME IS NOT PINNED HERE, and that is deliberate: rpm
#          FORBIDS '-' in both Version and Release, while this line's version
#          ("2026.8.16-1020679030-beta") contains two of them. Whatever
#          make-rpm.sh mangles that into (2026.8.16 + 1020679030.beta,
#          2026.8.16~1020679030~beta-1, ...) is the packaging script's call --
#          the same rule as every other asset here, where the script names the
#          artifact and this workflow only asserts. So the assertion below
#          matches `urnetwork-daemon[-_]*.rpm` and requires the two version
#          TOKENS that survive any legal mangling -- the date (2026.8.16) and
#          the beta code (1020679030) -- rather than the literal string.
#          TODO(packaging): MIGRATION.md's normative filename table has no rpm
#          row. Add one once make-rpm.sh has settled the mangling, and tighten
#          this assertion to the exact name at the same time.
#      URnetwork-<version>-<arch>.AppImage
#          The GUI. What the GUI's own updater offers.
#      URnetwork-<version>-<arch>.AppImage.zsync
#          The zsync control file. Attached for mirroring completeness ONLY:
#          zsync's multi-range requests get HTTP 501 from GitHub Releases, so
#          the AUTHORITATIVE copy is the self-hosted
#          https://get.ur.network/URnetwork-latest-<arch>.AppImage.zsync that
#          make-appimage.sh embeds as the AppImage's update information.
#      URnetwork-<version>-<arch>.flatpak
#          The GUI as a single-file Flatpak bundle, for hosts that would rather
#          `flatpak install` than run an AppImage. GUI ONLY -- a Flatpak
#          sandbox has no /dev/net/tun and no way to install a system unit, so
#          this asset still needs the daemon from the .deb/.rpm/tarball (see
#          packaging/flatpak/network.ur.urnetwork.yml).
#
#          THE ONLY OPTIONAL ASSET, and the only one attached AFTER the
#          release is created -- see the build-flatpak job header for why. If
#          that job fails, the release still publishes with the other five.
#
#    arch is the DEBIAN spelling -- amd64 / arm64 -- never x86_64/aarch64,
#    even though the AppImage's internal ARCH is x86_64. Keep it stable: a
#    renamed asset is an in-app updater that silently stops finding updates.
#    THE RPM IS THE ONE EXCEPTION: rpm names its own packages with the rpm
#    arch spelling (x86_64/aarch64), and fighting that would produce a package
#    whose filename disagrees with its own %{ARCH}. The assertion accepts
#    either spelling but rejects the WRONG arch (an aarch64 rpm out of the
#    amd64 leg).
#
#    NO SHA256SUMS ASSET, and no .sha256 sidecars are attached. The packaging
#    scripts still write sidecars next to their output (they are the local /
#    self-hosted-mirror story); this workflow deliberately does not upload
#    them. Verification rides the per-asset sha256 `digest` GitHub computes on
#    upload and serves in the same releases JSON the checker already fetches,
#    so the hash and the download URL come from the SAME asset object and a
#    repo mutated mid-flight cannot pair one with the other.
#
# 5. THE GLIBC FLOOR IS A BUILD-HOST DECISION, GATED BY A TEST.
#    The daemon is built on Ubuntu 22.04 (glibc 2.35) because the .deb's
#    `Depends: libc6 (>= 2.35)` is hand-written -- nfpm does not run
#    dpkg-shlibdeps -- and app/tests/glibc-floor-gate.sh (meson test
#    `glibc-floor`) is the only thing coupling that declaration to reality. A
#    24.04-built daemon pulls __isoc23_strtoll@GLIBC_2.38 through nlohmann's
#    number parser and CANNOT honestly claim 2.35. See the AppImage job for
#    the separate, deliberately different, GUI floor.
# =============================================================================

on:
  push:
    branches:
      - beta/custom-server
      - beta/algorithm-dpi
  pull_request:
    branches:
      - beta/custom-server
      - beta/algorithm-dpi
  workflow_dispatch:

permissions:
  contents: write
  # the version derive step reads this run's created_at via the actions api
  actions: read

# The release job DELETES the tag's release and then recreates it. Two runs of
# the same ref interleaving inside that window would leave the release deleted.
# Serialize pushes; cancel superseded PR runs, which never publish anyway.
concurrency:
  group: beta-build-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The SDK/connect refs are pinned to the beta integration line REGARDLESS of
  # which branch triggered this run -- the same rule the Windows workflow
  # follows. beta/algorithm-dpi carries the merged reliability checkpoint, the
  # DeviceLocalRpc bridge (sdk#135) and the cgo fixes this client needed as the
  # first c-abi consumer.
  UR_SDK_REPO: Ryanmello07/urnetwork-sdk
  UR_SDK_REF: beta/algorithm-dpi
  UR_CONNECT_REF: beta/algorithm-dpi
  # zig is used ONLY as a glibc-pinning cross compiler for the cgo SDK
  # (sdk:cgo/Makefile's LINUX_*_CC default is `zig cc -target
  # <arch>-linux-gnu.2.35`). Taken from PyPI rather than ziglang.org because
  # the PyPI package is version-addressable and its tarball URL grammar does
  # not change between zig releases the way the ziglang.org one has.
  UR_ZIG_VERSION: "0.14.1"
  # nfpm builds the .deb from packaging/deb/nfpm.yaml. packaging/make-deb.sh's
  # own comment records behavior "verified, v2.47" (contents[].src does not
  # expand environment variables), so pin the line that comment was written
  # against.
  # TODO(ci): confirm this tag exists and bump deliberately; an unpinned
  # "latest" here would let a packaging-affecting nfpm change land silently.
  UR_NFPM_VERSION: "2.47.0"
  # THE RPM IS REQUIRED FOR A RELEASE. packaging/make-rpm.sh is owned by the
  # packaging workstream, not by this file; if this workflow lands BEFORE that
  # script does, every push goes red and nothing publishes. Flip this one word
  # to "false" for that window: the daemon job then warns instead of failing,
  # and the release publishes the other assets. It must go back to "true" --
  # a silent-missing-rpm mode is exactly how the .deb would have quietly
  # stopped shipping.
  # Back to "true" as of v2026.8.16-1020748320-beta, which is the first release
  # that actually PUBLISHED an rpm (5 assets: tarball, .deb, .rpm, AppImage,
  # .zsync) with the SELinux policy module compiled on the jammy container --
  # the thing this was held open for. A silent-missing-rpm mode left on
  # permanently is exactly how the .deb would quietly stop shipping.
  #
  # It was briefly "false" while the rpm was landing, and that is the right
  # move again if the rpm ever breaks: a new package that cannot build must not
  # take the four already-contracted assets off the release with it.
  UR_REQUIRE_RPM: "true"
  # The Flatpak has NO equivalent knob here on purpose: a job-level `if:`
  # cannot read the `env` context (only github/needs/vars/inputs), so its kill
  # switch is the repository VARIABLE `UR_BUILD_FLATPAK` -- set it to "false"
  # in repo settings to skip that job entirely, with no edit to this file.
  # The GNOME runtime this manifest targets; only used to pre-warm the runner's
  # flatpak installation, and it MUST equal runtime-version in
  # packaging/flatpak/network.ur.urnetwork.yml (and RUNTIME_VERSION's default
  # in packaging/make-flatpak.sh). The build asserts that rather than trusting
  # it.
  UR_FLATPAK_RUNTIME: "49"

jobs:
  # ---------------------------------------------------------------------------
  # The cgo SDK is a c-shared .so. It is built once, for BOTH arches, on a
  # plain ubuntu-latest runner: zig cross-compiles to either arch and pins the
  # glibc floor at 2.35 while doing it, which is both faster and cheaper than
  # provisioning Go onto each target-arch runner -- and it produces the exact
  # URnetworkSdkLinux.zip layout app/scripts/fetch-deps.sh expects.
  #
  # This job also OWNS THE VERSION for the whole run (see the contract above).
  # The linux repo itself is deliberately NOT checked out here: nothing in this
  # job reads it, and `gh api repos/$GITHUB_REPOSITORY/...` resolves from the
  # environment, not from a checkout.
  # ---------------------------------------------------------------------------
  build-sdk:
    name: Build SDK .so (linux/amd64 + arm64) + derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
    steps:
      # Same version scheme as the windows, android and apple beta lines: the
      # official date format with warpctl's counter (seconds since the company
      # founding times 10), derived from the RUN's creation time so every job
      # of one run agrees even across midnight utc.
      - name: Derive version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          created=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID --jq .created_at)
          base=$(date -u -d "$created" '+%Y.%-m.%-d')
          founded=$(date -u -d "2023-05-23" +%s)
          created_epoch=$(date -u -d "$created" +%s)
          beta_code=$(( (created_epoch - founded) * 10 ))
          version="${base}-${beta_code}-beta"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${beta_code}" >> "$GITHUB_OUTPUT"
          # make-install-tarball.sh honours SOURCE_DATE_EPOCH for GNU tar's
          # --mtime, so pinning it to the run's own creation time makes the
          # tarball reproducible for a given run rather than stamped "1970".
          echo "source_date_epoch=${created_epoch}" >> "$GITHUB_OUTPUT"
          echo "build date ${base} -> beta ${version} (code ${beta_code}, epoch ${created_epoch})"

      - name: Check out forked SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UR_SDK_REPO }}
          ref: ${{ env.UR_SDK_REF }}
          # MUST be the directory name `sdk`, not `urnetwork-sdk`: sdk/cgo's
          # go.mod resolves the siblings below with `replace ... => ../../<name>`
          # and the module path is github.com/urnetwork/sdk.
          path: sdk

      # sdk/cgo/go.mod resolves these with `replace ... => ../../<name>`, so
      # they have to sit as siblings of the sdk checkout (i.e. at the workspace
      # root, which is `sdk/cgo/../..`).
      - name: Check out connect dependency
        run: git clone --depth 1 --branch "$UR_CONNECT_REF" https://github.com/Ryanmello07/connect.git connect

      - name: Check out glog dependency
        run: git clone --depth 1 https://github.com/urnetwork/glog.git glog

      - name: Check out goidenticons dependency
        run: git clone --depth 1 https://github.com/urnetwork/goidenticons.git goidenticons

      # The sdk references RenderPngV2. goidenticons did not publish it when
      # the windows workflow was written, so it shimmed it; it does now (same
      # signature), and an unconditional shim is a REDECLARATION that fails the
      # build. Write it only when the symbol is genuinely absent, so this works
      # against either version of the dependency. (Copied verbatim from the
      # windows workflow -- same dependency, same trap.)
      - name: Shim goidenticons RenderPngV2 if unpublished
        run: |
          if grep -qR '^func RenderPngV2(' goidenticons/; then
            echo "goidenticons publishes RenderPngV2 -- no shim needed"
          else
            echo "goidenticons lacks RenderPngV2 -- shimming to RenderPng"
            echo 'package goidenticons' > goidenticons/render_v2_ci_shim.go
            echo 'func RenderPngV2(data []byte, size int) ([]byte, error) { return RenderPng(data, size) }' >> goidenticons/render_v2_ci_shim.go
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # The Makefile's LINUX_AMD64_CC/LINUX_ARM64_CC default to `zig cc -target
      # <arch>-linux-gnu.2.35`. Putting a `zig` shim on PATH means the recipe
      # runs UNMODIFIED -- no CC override to drift out of sync with the
      # Makefile, and the glibc pin stays where it is documented.
      - name: Install zig (PyPI ziglang, pinned)
        run: |
          # A venv, not `pip install --user`: Ubuntu 24.04's system python is
          # PEP 668 externally-managed and refuses a user install outright.
          python3 -m venv "$RUNNER_TEMP/zigvenv"
          "$RUNNER_TEMP/zigvenv/bin/pip" install --quiet "ziglang==${UR_ZIG_VERSION}"
          sudo install -d /usr/local/bin
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$RUNNER_TEMP/zigvenv/bin/python" \
            | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod 0755 /usr/local/bin/zig
          zig version

      - name: Build the SDK Linux shared objects
        working-directory: sdk/cgo
        env:
          WARP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # go.sum is generated (git-ignored) -- a build straight from a branch
          # has not staged one, so produce it before the cgo build needs it
          if [ ! -f go.sum ]; then go mod download all; fi
          make build_linux
          ls -la build/linux/amd64 build/linux/arm64

      # The Makefile chains its recipes with `; \`, so a failing `go build`
      # does NOT fail the target -- the trailing `cp` of the headers succeeds
      # and make exits 0. On the windows line that is exactly how a compile
      # error shipped a "successful" SDK job whose zip contained three headers
      # and no DLL, leaving the app jobs to fail 40 lines later with a
      # confusing missing-file error. `ls` and `test -s <zip>` both passed on
      # that build, because the dirs and the zip did exist. Assert on the
      # ARTIFACT THAT MATTERS instead -- and, because zig's glibc pin is not
      # self-verifying (ziglang/zig#25415), assert the floor here too rather
      # than discovering it two jobs later in the daemon's meson gate.
      - name: Verify the SDK actually produced shared objects
        working-directory: sdk/cgo
        run: |
          fail=0
          for arch in amd64 arm64; do
            so="build/linux/$arch/libURnetworkSdk.so"
            if [ ! -f "$so" ]; then
              echo "::error::$so was not produced -- the cgo build failed (see the make output above)"
              fail=1
              continue
            fi
            # a real c-shared build of this sdk is tens of MB; anything tiny
            # means a truncated or stub link, which would fail far downstream
            size=$(stat -c %s "$so")
            echo "$so: $size bytes"
            if [ "$size" -lt 5000000 ]; then
              echo "::error::$so is only $size bytes -- implausibly small for the sdk"
              fail=1
            fi
            # the .a is a container and `file` on it says nothing about the
            # architecture; readelf on the .so reads the ELF header directly
            machine=$(readelf -h "$so" | sed -n 's/^ *Machine: *//p')
            echo "$so machine: $machine"
            case "$arch:$machine" in
              amd64:*X86-64*|arm64:*AArch64*) ;;
              *) echo "::error::$so reports machine '$machine', which is not $arch"; fail=1 ;;
            esac
            # zig was asked for -target <arch>-linux-gnu.2.35. Prove it, here,
            # on the artifact -- the pin is a compiler flag, not a guarantee.
            maxsym=$(readelf --dyn-syms -W "$so" | { grep -o 'GLIBC_[0-9.]*' || true; } \
                     | sed 's/^GLIBC_//' | sort -V | tail -n1)
            echo "$so: max GLIBC_${maxsym:-none}"
            if [ -n "$maxsym" ] && [ "$(printf '%s\n%s\n' "$maxsym" "2.35" | sort -V | tail -n1)" != "2.35" ]; then
              echo "::error::$so references GLIBC_${maxsym}, above the declared 2.35 floor -- the zig -gnu.2.35 pin did not hold (ziglang/zig#25415)"
              fail=1
            fi
            # the headers the app compiles against must ride along
            for h in urnetwork_sdk.h urnetwork_sdk.hpp; do
              [ -f "build/linux/$arch/$h" ] || { echo "::error::build/linux/$arch/$h missing"; fail=1; }
            done
          done
          # and the zip must carry them, since that is what the app jobs unpack
          for arch in amd64 arm64; do
            if ! unzip -l build/URnetworkSdkLinux.zip | grep -q "linux/$arch/libURnetworkSdk.so"; then
              echo "::error::URnetworkSdkLinux.zip is missing linux/$arch/libURnetworkSdk.so"
              fail=1
            fi
          done
          exit $fail

      - name: Upload the SDK zip
        uses: actions/upload-artifact@v4
        with:
          # mirror of the windows line's `urnetwork-sdk-windows`; also the name
          # `gh run download -n urnetwork-sdk-linux -D .local-deps` expects
          name: urnetwork-sdk-linux
          path: sdk/cgo/build/URnetworkSdkLinux.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # THE DAEMON: the artifact the app downloads and installs behind pkexec.
  #
  # THE .RPM IS BUILT HERE, NOT IN A JOB OF ITS OWN, and that is the whole
  # point of it: the rpm, the .deb and the install tarball are three wrappers
  # around ONE `meson install --destdir` staging tree, assembled by ONE
  # function (packaging/lib/common.sh assemble_daemon_root). A separate rpm job
  # would have to rebuild the daemon to get a staging tree, and the moment it
  # did, "the rpm and the deb ship the same daemon" would stop being a fact and
  # become a hope. It also inherits the glibc floor and the meson gate below
  # for free -- an rpm built on a 24.04 image would carry GLIBC_2.38 symbols
  # under a Fedora dependency set that never mentions them.
  #
  # Built INSIDE an ubuntu:22.04 container rather than on a `runs-on:
  # ubuntu-22.04` hosted image. Both are "build on Ubuntu 22.04"; the container
  # is chosen because
  #   * it pins glibc 2.35 to the IMAGE, independent of GitHub's runner-image
  #     lifecycle (a retired ubuntu-22.04 label does not fail loudly -- the job
  #     just never gets a runner), and
  #   * it is the same split the repo's own pipeline already uses: build.sh
  #     documents "per arch two Docker images: the daemon .deb + install
  #     tarball on ubuntu 22.04, and the GUI AppImage on 24.04".
  # If the hosted image is preferred instead, `runs-on: ubuntu-22.04` with the
  # `container:` line removed is the drop-in alternative.
  #
  # meson 0.61.2 (jammy's apt build) is what app/meson.build is known to
  # configure under -- do not "modernize" this to a pip meson without checking.
  # ---------------------------------------------------------------------------
  build-daemon:
    name: Build daemon + install tarball + deb + rpm (${{ matrix.arch }})
    needs: build-sdk
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # arm64 needs a native arm64 runner (the AppImage half bundles host
          # libraries, so cross-building is not an option there either, and
          # keeping both halves on the same rule keeps the asset set coherent).
          # Uncomment when the arm64 line is turned on -- nothing else in this
          # workflow hardcodes amd64.
          # - arch: arm64
          #   runner: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.build-sdk.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.build-sdk.outputs.source_date_epoch }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git first: actions/checkout silently degrades to a REST tarball
      # download without it, and the packaging scripts want a real tree.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext \
            libglib2.0-dev nlohmann-json3-dev \
            git curl ca-certificates unzip xz-utils binutils file python3
          meson --version

      - name: Check out Linux repo
        uses: actions/checkout@v4

      - name: Download the SDK zip
        uses: actions/download-artifact@v4
        with:
          name: urnetwork-sdk-linux
          path: sdk-zip

      # The repo's own vendoring entry point -- never unzip by hand here, the
      # script also stages urnetwork_sdk.h NEXT TO the .hpp (the .hpp includes
      # it relative to itself, so a missing .h is a compile error, not a link
      # error).
      # $PWD, not ${{ github.workspace }}: inside a container job the expression
      # can resolve to the HOST path, while the shell is in the mapped
      # container path. Every absolute path in this job is derived from the
      # shell's own cwd for that reason.
      - name: Vendor the SDK into third_party
        run: app/scripts/fetch-deps.sh "$PWD/sdk-zip/URnetworkSdkLinux.zip"

      # -Dgui=disabled, not the 'auto' default: this image has no GTK4 at all,
      # and being explicit means a future image that happens to carry gtkmm
      # cannot silently start building (and shipping) a GUI from the low-glibc
      # daemon leg.
      - name: Configure (meson)
        run: |
          meson setup build app \
            --prefix=/usr \
            -Dgui=disabled \
            -Dhost_integration=true \
            -Dsdk_arch=${{ matrix.arch }} \
            -Dapp_version="$VERSION" \
            -Dglibc_floor=2.35

      - name: Build
        run: ninja -C build

      # Runs BOTH meson tests:
      #   unit         the pure-logic suite (projection math, TopoJSON decoder,
      #                provider rows, location-override state machine, the
      #                control protocol's framing/version/SDK-build/peer-cred
      #                rules)
      #   glibc-floor  app/tests/glibc-floor-gate.sh against the built
      #                urnetworkd AND the vendored libURnetworkSdk.so. THIS IS
      #                THE GATE the owner asked for: it is the only thing
      #                coupling the .deb's hand-written
      #                `Depends: libc6 (>= 2.35)` to the actual binary.
      - name: Test (unit + glibc-floor gate)
        run: meson test -C build --print-errorlogs

      - name: Upload the meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-daemon-${{ matrix.arch }}
          path: |
            build/meson-logs/
          if-no-files-found: warn

      # The packaging scripts consume ONLY a `meson install --destdir` tree --
      # that is their documented input contract, and it is what keeps the .deb
      # and the tarball from ever drifting apart (both go through
      # packaging/lib/common.sh assemble_daemon_root against this same tree).
      - name: Stage the install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          find "$PWD/staging" -type f | sort

      - name: Install nfpm (for the .deb)
        run: |
          # nfpm publishes GoReleaser-named tarballs: nfpm_<v>_Linux_<goarch>,
          # where amd64 is spelled x86_64.
          case "${{ matrix.arch }}" in
            amd64) nfpm_arch=x86_64 ;;
            arm64) nfpm_arch=arm64 ;;
            *) echo "::error::no nfpm asset mapping for arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          curl -fsSL --retry 3 --retry-all-errors \
            -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${UR_NFPM_VERSION}/nfpm_${UR_NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          sha256sum /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          chmod 0755 /usr/local/bin/nfpm
          nfpm --version

      # Deliberately a step of its own, not another word on the build-deps
      # line: if jammy's `rpm` ever moves or disappears, the failure should
      # name the rpm and not look like the daemon failing to compile.
      #
      # nfpm needs NONE of this -- it writes rpms in pure Go -- but
      # packaging/make-rpm.sh is not written yet and may reasonably use
      # rpmbuild with a real spec (which is what docs/linux_agent_help.md 10.2
      # actually describes: %systemd_post / %systemd_preun /
      # %systemd_postun_with_restart scriptlets, which nfpm cannot emit). Both
      # paths work with this installed, and `rpm -qp` is also what makes the
      # payload assertion below possible at all.
      - name: Install rpm tooling (for the .rpm)
        run: |
          # checkpolicy + semodule-utils are NOT optional extras: make-rpm.sh
          # hard-fails without checkmodule AND semodule_package, because the
          # SELinux policy module is the whole reason the Fedora-family package
          # can open /dev/net/tun. Note the package split differs by family and
          # getting it wrong looks identical to not trying -- semodule_package
          # ships in **semodule-utils** on Debian/Ubuntu (measured by unpacking
          # the jammy debs) but in **policycoreutils** on Fedora (measured with
          # rpm -qf on a Bazzite host). This runner is Ubuntu, so it needs
          # semodule-utils; installing policycoreutils here would NOT provide it.
          apt-get install -y --no-install-recommends rpm checkpolicy semodule-utils
          rpm --version
          rpmbuild --version || true
          # Fail here, with a legible message, rather than 40 lines later inside
          # make-rpm.sh's die.
          for t in checkmodule semodule_package; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::${t} is missing after installing checkpolicy + semodule-utils; make-rpm.sh cannot build the SELinux policy module"; exit 1; }
          done

      - name: Package the install tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export STAGING_DIR="$PWD/staging" OUT_DIR="$PWD/dist"
          packaging/make-install-tarball.sh

      - name: Package the .deb
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export STAGING_DIR="$PWD/staging" OUT_DIR="$PWD/dist"
          packaging/make-deb.sh

      # Same four-variable contract as every other packaging script
      # (MIGRATION.md's invocation table): VERSION / ARCH / STAGING_DIR /
      # OUT_DIR in, one normative artifact into $OUT_DIR. ARCH stays the DEBIAN
      # spelling on the way IN even though rpm names its output x86_64 --
      # make-deb.sh, make-install-tarball.sh and make-appimage.sh all take
      # amd64|arm64, common.sh's check_payload_arch only understands those two,
      # and one script taking a different vocabulary than its siblings is how
      # an arch mismatch gets shipped.
      - name: Package the .rpm
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ ! -f packaging/make-rpm.sh ]; then
            if [ "${UR_REQUIRE_RPM}" = "true" ]; then
              echo "::error::packaging/make-rpm.sh does not exist. It is owned by the packaging workstream and this workflow requires it (see UR_REQUIRE_RPM at the top of this file). Either land the script or set UR_REQUIRE_RPM to \"false\" for the window in between."
              exit 1
            fi
            echo "::warning::packaging/make-rpm.sh is missing and UR_REQUIRE_RPM is not \"true\" -- skipping the .rpm. The release will publish without it."
            exit 0
          fi
          chmod +x packaging/make-rpm.sh
          export STAGING_DIR="$PWD/staging" OUT_DIR="$PWD/dist"
          # The escape hatch has to cover the SCRIPT FAILING, not just the
          # script being absent. It did not, and that was a release-blocker:
          # once make-rpm.sh landed, control fell through to a bare invocation
          # whose non-zero exit failed build-daemon, which skipped `release`,
          # which stopped the tarball, the .deb, the AppImage and the .zsync
          # from publishing. A new package that cannot build must never take
          # the four contracted assets down with it -- that turns a missing
          # fifth asset into a release of nothing.
          if packaging/make-rpm.sh; then
            :
          elif [ "${UR_REQUIRE_RPM}" = "true" ]; then
            echo "::error::packaging/make-rpm.sh failed and UR_REQUIRE_RPM is \"true\". Fix the rpm, or set UR_REQUIRE_RPM to \"false\" to publish the other assets while it is broken."
            exit 1
          else
            echo "::warning::packaging/make-rpm.sh failed and UR_REQUIRE_RPM is not \"true\" -- publishing without the .rpm."
          fi

      # A compile-proof says nothing about what landed inside the package, and
      # that blind spot is exactly how the Windows MSI shipped for months
      # installing 7 files while silently omitting the runtime and the fonts --
      # an install on a clean machine could not start. Fail here, before
      # anything is uploaded or attached to a release, if the payload regresses
      # to that shape. Named files, not just a count: a count alone passes a
      # tarball that is all locale catalogs and no daemon.
      - name: Verify the install tarball payload
        working-directory: dist
        run: |
          tarball="urnetwork-daemon-${VERSION}-${{ matrix.arch }}.install.tar.gz"
          [ -f "$tarball" ] || { echo "::error::$tarball was not produced"; exit 1; }
          listing=$(mktemp)
          tar tzf "$tarball" > "$listing"
          fail=0
          for want in \
            urnetwork-daemon/install.sh \
            urnetwork-daemon/uninstall.sh \
            urnetwork-daemon/VERSION \
            urnetwork-daemon/selinux/urnetwork.te \
            urnetwork-daemon/payload/usr/lib/urnetwork/urnetworkd \
            urnetwork-daemon/payload/usr/lib/urnetwork/libURnetworkSdk.so \
            urnetwork-daemon/payload/usr/bin/urnetwork \
            urnetwork-daemon/payload/lib/systemd/system/urnetworkd.service \
            urnetwork-daemon/payload/usr/share/applications/network.ur.urnetwork.desktop \
            urnetwork-daemon/payload/usr/share/urnetwork/world-110m.json \
            urnetwork-daemon/payload/etc/NetworkManager/conf.d/95-urnetwork.conf \
            urnetwork-daemon/payload/etc/udev/rules.d/85-urnetwork-unmanaged.rules \
            urnetwork-daemon/payload/etc/urnetwork/autostart/network.ur.urnetwork.desktop ; do
            grep -qx "$want" "$listing" || { echo "::error::$tarball is missing $want"; fail=1; }
          done
          # tray art and the gettext catalogs are globs, not fixed names
          grep -q '^urnetwork-daemon/payload/usr/share/urnetwork/icons/.*\.png$' "$listing" \
            || { echo "::error::$tarball carries no tray icons"; fail=1; }
          grep -q '^urnetwork-daemon/payload/usr/share/locale/.*/LC_MESSAGES/urnetwork\.mo$' "$listing" \
            || { echo "::error::$tarball carries no gettext catalogs"; fail=1; }
          # Sanity floor, not an exact count: the staged tree is ~50 files plus
          # directory entries. A floor of 40 catches a truncated payload
          # without failing over one added or removed locale.
          # grep -c exits 1 on zero matches, which `bash -e` would treat as a
          # step failure before the assertion below could report anything.
          entries=$(grep -cv '/$' "$listing" || true)
          echo "payload file entries: $entries"
          [ "${entries:-0}" -ge 40 ] || { echo "::error::$tarball has only ${entries:-0} file entries -- expected at least 40"; fail=1; }
          # the version the installer will report must be the version we tagged
          staged_version=$(tar -xzOf "$tarball" urnetwork-daemon/VERSION)
          echo "VERSION inside the tarball: $staged_version"
          [ "$staged_version" = "$VERSION" ] || { echo "::error::tarball VERSION is '$staged_version', expected '$VERSION'"; fail=1; }
          exit $fail

      - name: Verify the .deb payload
        working-directory: dist
        run: |
          deb="urnetwork-daemon_${VERSION}_${{ matrix.arch }}.deb"
          [ -f "$deb" ] || { echo "::error::$deb was not produced"; exit 1; }
          # dpkg-deb is not in the jammy container by default; the tarball
          # assertion above already covers the shared payload (both packages go
          # through assemble_daemon_root), so this is a secondary check.
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends dpkg-dev >/dev/null 2>&1 || true
          fi
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb --info "$deb"
            listing=$(mktemp)
            dpkg-deb --contents "$deb" > "$listing"
            fail=0
            for want in \
              ./usr/lib/urnetwork/urnetworkd \
              ./usr/lib/urnetwork/libURnetworkSdk.so \
              ./usr/bin/urnetwork \
              ./lib/systemd/system/urnetworkd.service ; do
              grep -q " ${want}\$" "$listing" || { echo "::error::$deb is missing $want"; fail=1; }
            done
            entries=$(grep -cv '/$' "$listing" || true)
            echo "deb file entries: $entries"
            [ "${entries:-0}" -ge 40 ] || { echo "::error::$deb has only ${entries:-0} file entries"; fail=1; }
            exit $fail
          else
            echo "::warning::dpkg-deb unavailable -- skipped the .deb content assertion"
          fi

      # The .rpm gets the SAME treatment as the other two, for the same reason
      # (a compile-proof says nothing about what landed inside the package),
      # and `rpm` is installed above precisely so this can be a real assertion
      # rather than a file-exists check.
      #
      # The version check is on TOKENS, not on the literal ${VERSION}: see the
      # asset-name contract at the top of this file -- rpm forbids '-' in
      # Version and Release, so no legal rpm filename can contain
      # "2026.8.16-1020679030-beta" verbatim. The date and the beta code
      # survive every legal mangling, and the beta code is what makes an
      # artifact unique to THIS run, which is the property the check exists to
      # protect.
      - name: Verify the .rpm payload
        working-directory: dist
        # REQUIRED, and the only step in this job that needs it. This job runs
        # in `container: ubuntu:22.04`, where the default shell resolves to
        # `sh -e` (dash) rather than the `bash -e` a runner-hosted job gets --
        # so `shopt -s nullglob` below died with "shopt: not found", exit 127,
        # and took the whole daemon job with it. Every other step in this job
        # is POSIX-clean, which is why this never showed up before.
        shell: bash
        run: |
          shopt -s nullglob
          # Binary rpms only. rpmbuild -ba (as opposed to -bb) also drops a
          # .src.rpm beside them, and that is not an asset in this contract --
          # counting it would turn a legitimate build into "expected one rpm,
          # found two".
          rpms=()
          for f in urnetwork-daemon[-_]*.rpm; do
            case "$f" in *.src.rpm) continue ;; esac
            rpms+=("$f")
          done
          if [ "${#rpms[@]}" -eq 0 ]; then
            if [ "${UR_REQUIRE_RPM}" = "true" ]; then
              echo "::error::packaging/make-rpm.sh produced no urnetwork-daemon*.rpm in \$OUT_DIR"
              exit 1
            fi
            echo "::warning::no .rpm produced and UR_REQUIRE_RPM is not \"true\" -- skipping the rpm assertions"
            exit 0
          fi
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .rpm from this arch leg, found ${#rpms[@]}: ${rpms[*]}"
            exit 1
          fi
          rpm_file="${rpms[0]}"
          echo "rpm: $rpm_file"
          fail=0

          # "2026.8.16-1020679030-beta" -> date 2026.8.16, code 1020679030
          ver_date="${VERSION%%-*}"
          ver_rest="${VERSION#*-}"
          ver_code="${ver_rest%%-*}"
          for tok in "$ver_date" "$ver_code"; do
            case "$rpm_file" in
              *"$tok"*) ;;
              *) echo "::error::$rpm_file does not carry version token '$tok' from ${VERSION}"; fail=1 ;;
            esac
          done

          # The arch tag: either spelling in the FILENAME, but never the other
          # arch. An aarch64 rpm falling out of the amd64 leg is the failure
          # this catches, and it is not hypothetical -- the staging tree is
          # arch-specific and a script that hardcodes an arch would produce
          # exactly that.
          case "${{ matrix.arch }}" in
            amd64) want_rpm_arch=x86_64;  other_rpm_arch=aarch64; other_deb_arch=arm64 ;;
            arm64) want_rpm_arch=aarch64; other_rpm_arch=x86_64;  other_deb_arch=amd64 ;;
            *) echo "::error::no rpm arch mapping for '${{ matrix.arch }}'"; exit 1 ;;
          esac
          case "$rpm_file" in
            *"$other_rpm_arch"*|*"$other_deb_arch"*)
              echo "::error::$rpm_file names the wrong architecture -- this is the ${{ matrix.arch }} leg"
              fail=1 ;;
            *"$want_rpm_arch"*|*"${{ matrix.arch }}"*) ;;
            *) echo "::error::$rpm_file carries no architecture tag ($want_rpm_arch or ${{ matrix.arch }})"; fail=1 ;;
          esac

          rpm -qip "$rpm_file" || { echo "::error::rpm cannot read $rpm_file -- it is not a valid rpm"; exit 1; }
          rpm_arch=$(rpm -qp --qf '%{ARCH}' "$rpm_file")
          echo "rpm %{ARCH}: $rpm_arch"
          [ "$rpm_arch" = "$want_rpm_arch" ] || { echo "::error::$rpm_file has %{ARCH}=$rpm_arch, expected $want_rpm_arch"; fail=1; }
          rpm_vr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm_file")
          echo "rpm %{VERSION}-%{RELEASE}: $rpm_vr"
          for tok in "$ver_date" "$ver_code"; do
            case "$rpm_vr" in
              *"$tok"*) ;;
              *) echo "::error::rpm metadata '$rpm_vr' does not carry version token '$tok'"; fail=1 ;;
            esac
          done

          listing=$(mktemp)
          rpm -qpl "$rpm_file" > "$listing"
          for want in \
            /usr/lib/urnetwork/urnetworkd \
            /usr/lib/urnetwork/libURnetworkSdk.so \
            /usr/bin/urnetwork \
            /usr/share/urnetwork/world-110m.json ; do
            grep -qx "$want" "$listing" || { echo "::error::$rpm_file is missing $want"; fail=1; }
          done
          # THE SYSTEMD UNIT PATH IS THE ONE PLACE THE RPM CANNOT JUST REUSE
          # THE DEB'S TREE. assemble_daemon_root writes the unit to
          # /lib/systemd/system, which is correct for Debian and WRONG for the
          # rpm world: Fedora/RHEL/openSUSE are UsrMerge systems where /lib is
          # a symlink to /usr/lib, and packaging a path under a symlinked
          # legacy dir is a Fedora packaging violation that newer rpm rejects
          # outright ("must not be under legacy symlinked dir"). Accept either
          # here -- this workflow does not own make-rpm.sh -- but say so
          # loudly, because the failure mode is an rpm that installs on Ubuntu
          # and refuses to build or install on the distros it exists for.
          if grep -qx '/usr/lib/systemd/system/urnetworkd.service' "$listing"; then
            echo "unit: /usr/lib/systemd/system/urnetworkd.service (correct for rpm)"
          elif grep -qx '/lib/systemd/system/urnetworkd.service' "$listing"; then
            echo "::warning::$rpm_file ships the unit at /lib/systemd/system/urnetworkd.service. On UsrMerge distros (all current rpm distros) /lib is a symlink to /usr/lib; Fedora packaging forbids this path and rpm >= 4.19 errors on it. make-rpm.sh should relocate the unit to /usr/lib/systemd/system."
          else
            echo "::error::$rpm_file ships no urnetworkd.service under either /lib/systemd/system or /usr/lib/systemd/system"
            fail=1
          fi
          entries=$(grep -cv '/$' "$listing" || true)
          echo "rpm file entries: $entries"
          [ "${entries:-0}" -ge 40 ] || { echo "::error::$rpm_file has only ${entries:-0} file entries -- expected at least 40"; fail=1; }

          # THE SELINUX POLICY MODULE, which is the single most important thing
          # this rpm carries that the .deb does not need. Measured on this
          # project's own Fedora-family host: with no policy module the daemon
          # lands in the init_t domain, which is DENIED /dev/net/tun, raw
          # sockets and outbound 443 -- and root plus CAP_NET_ADMIN does not
          # help, because the MAC layer refuses before the capability is ever
          # consulted. The install tarball ships packaging/selinux/urnetwork.te
          # and loads it from install.sh for exactly this reason; the .deb
          # legitimately does not, because Debian/Ubuntu are AppArmor hosts.
          # The rpm is the artifact aimed AT the SELinux distros, so shipping
          # it without the policy produces a package that installs cleanly,
          # starts cleanly, and cannot open a tunnel.
          #
          # A warning and not an error: this workflow does not own make-rpm.sh,
          # and how the policy ships (a prebuilt .pp under
          # /usr/share/selinux/packages plus `semodule -i` in %post, or a
          # source .te compiled in the scriptlet) is that script's call.
          scripts_out=$(rpm -qp --scripts "$rpm_file" 2>/dev/null || true)
          if grep -qi 'selinux' "$listing" || printf '%s' "$scripts_out" | grep -qi 'semodule'; then
            echo "selinux: the rpm ships a policy module and/or loads one from a scriptlet"
          else
            echo "::warning::$rpm_file ships no SELinux policy module and no scriptlet that runs semodule. On Fedora/RHEL/CentOS -- the distros this package exists for -- urnetworkd then runs in init_t and is refused /dev/net/tun, raw sockets and outbound 443 by the MAC layer before CAP_NET_ADMIN is consulted, so the service starts and the tunnel never comes up. packaging/selinux/urnetwork.te is the module the install tarball already uses."
          fi
          exit $fail

      # The .sha256 sidecars the packaging scripts write are deliberately NOT
      # carried forward: the release verifies through GitHub's per-asset digest
      # (see the contract at the top of this file). The globs end in the exact
      # extension for that reason -- `*.rpm` does not match `*.rpm.sha256`.
      # Both rpm spellings are listed because make-rpm.sh has not settled
      # whether it separates name from version with '-' (rpm's own convention)
      # or '_' (the .deb's); `if-no-files-found: error` cannot police that
      # anyway, since it fires only when the WHOLE set is empty -- the verify
      # step above is the real gate on the rpm's presence.
      - name: Upload the daemon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-linux-daemon-${{ matrix.arch }}
          path: |
            dist/urnetwork-daemon-*.install.tar.gz
            dist/urnetwork-daemon_*.deb
            dist/urnetwork-daemon-*.rpm
            dist/urnetwork-daemon_*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # THE GUI: the AppImage, which ships the UI ONLY. It never contains the
  # daemon; the service comes from the tarball above, downloaded by the app.
  #
  # Pinned to ubuntu-24.04, NOT ubuntu-latest: the AppDir bundles the BUILD
  # HOST's GTK4/libadwaita stack, so the host image literally decides what the
  # AppImage is made of and what it requires at runtime. A silent
  # ubuntu-latest bump would silently move the GUI's floor.
  #
  # THE GUI FLOOR IS NOT THE DAEMON FLOOR, ON PURPOSE.
  # Ubuntu 22.04 does not package libgtkmm-4.0 (that is exactly why the daemon
  # can be built there), so the GUI cannot be built on the 2.35 image at all.
  # 24.04 is glibc 2.39, so make-appimage.sh's own ceiling gate -- default
  # 2.35 -- would refuse to package. The script documents the two honest ways
  # out ("build the GUI against the floor (zig/sysroot), or knowingly raise the
  # AppImage's floor"), and only the second is available today, so this job
  # raises the ceiling EXPLICITLY rather than passing UR_SKIP_GLIBC_GATE=1.
  # The gate still runs; it is just told the truth about this artifact.
  #
  #   ==> DECISION FOR THE OWNER: the AppImage's supported floor is Ubuntu
  #       24.04 / glibc 2.39, while the daemon keeps 2.35. If the AppImage
  #       must also run on 22.04, the GUI needs a zig/sysroot build and this
  #       line has to go back to 2.35.
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build GUI AppImage (${{ matrix.arch }})
    needs: build-sdk
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            appimage_arch: x86_64
            runner: ubuntu-24.04
          # - arch: arm64
          #   appimage_arch: aarch64
          #   runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.build-sdk.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out Linux repo
        uses: actions/checkout@v4

      - name: Download the SDK zip
        uses: actions/download-artifact@v4
        with:
          name: urnetwork-sdk-linux
          path: sdk-zip

      # libglib2.0-bin carries gio-querymodules AND glib-compile-schemas, both
      # of which make-appimage.sh requires by name. libgdk-pixbuf2.0-bin, the
      # Adwaita theme, librsvg (Adwaita's symbolic SVGs) and glib-networking
      # (the GIO TLS modules) are all bundled INTO the AppDir from this host,
      # so they are build deps even though nothing links against them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext \
            libglib2.0-dev libglib2.0-bin nlohmann-json3-dev \
            libgtkmm-4.0-dev libadwaita-1-dev libfontconfig1-dev \
            adwaita-icon-theme gtk-update-icon-cache librsvg2-common \
            libgdk-pixbuf2.0-bin glib-networking \
            squashfs-tools zsync patchelf binutils desktop-file-utils file \
            git curl unzip
          meson --version

      # make-appimage.sh REFUSES to package a GUI with a webkitgtk NEEDED entry
      # (WebKitGTK hardcodes absolute paths to its multi-process helpers at
      # compile time; nothing relocates them, so an AppImage that links it
      # cannot work). meson treats webkit as a soft dependency and would link
      # it if the dev package were present, so assert it is not -- a clear
      # failure here beats a confusing one after the whole AppDir is built.
      - name: Assert webkitgtk-6.0 is absent from the build host
        run: |
          if pkg-config --exists webkitgtk-6.0; then
            echo "::error::webkitgtk-6.0 is installed on this runner -- meson would link the embedded checkout webview in and make-appimage.sh would refuse to package. Do not install libwebkitgtk-6.0-dev in this job."
            exit 1
          fi
          echo "webkitgtk-6.0 absent, as required"

      - name: Vendor the SDK into third_party
        run: app/scripts/fetch-deps.sh "$PWD/sdk-zip/URnetworkSdkLinux.zip"

      # -Dgui=enabled makes a missing toolkit a HARD ERROR. Without it, meson's
      # 'auto' would quietly build the daemon half only and this job would
      # produce no GUI at all -- and make-appimage.sh's missing-binary message
      # would be the first anyone heard of it.
      #
      # -Dhost_integration=true (the default) is required here, not incidental:
      # it is what puts the vendored SDK at usr/lib/urnetwork/libURnetworkSdk.so
      # in the staging tree, which is exactly where make-appimage.sh looks. The
      # daemon binary it also builds is a byproduct; the AppImage never takes it.
      - name: Configure (meson)
        run: |
          meson setup build app \
            --prefix=/usr \
            -Dgui=enabled \
            -Dhost_integration=true \
            -Dsdk_arch=${{ matrix.arch }} \
            -Dapp_version="$VERSION"

      - name: Build
        run: ninja -C build

      # Only the `unit` suite here. The `glibc-floor` gate belongs to the
      # daemon job and would CORRECTLY fail on this 24.04 image -- the daemon
      # binary built here is a byproduct that is never shipped, and running the
      # gate against it would either produce a false red or, worse, tempt
      # someone to weaken the gate that protects the real daemon.
      - name: Test (unit suite)
        run: meson test -C build --print-errorlogs unit

      - name: Upload the meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-gui-${{ matrix.arch }}
          path: |
            build/meson-logs/
          if-no-files-found: warn

      - name: Stage the install tree
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          test -x "$PWD/staging/usr/bin/urnetwork-gui"

      # appimagetool fetches the type2 runtime from GitHub on EVERY invocation
      # and has no retry, so a blip fails the whole build after all the AppDir
      # work ("Failed to download runtime: server returned status code 0").
      # Pre-fetch both with retries and hand the runtime over via
      # UR_APPIMAGE_RUNTIME, which also pins exactly which runtime ships rather
      # than taking whatever "continuous" serves that minute.
      #
      # TODO(ci): pin appimagetool and the runtime BY SHA256, the way the
      # windows line pins wintun (sha256 + Authenticode thumbprint). Both are
      # published only under the moving `continuous` tag, so the hashes have to
      # be captured once by hand from the digests this step prints and then
      # asserted here.
      - name: Fetch appimagetool + type2 runtime
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl -fsSL --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/runtime-${{ matrix.appimage_arch }}" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.appimage_arch }}"
          # record what actually shipped -- see the TODO above about pinning
          sha256sum "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/runtime-${{ matrix.appimage_arch }}"

      # APPIMAGE_EXTRACT_AND_RUN=1: appimagetool is itself an AppImage and
      # GitHub's runners have no libfuse2, so it cannot mount itself.
      # UR_GLIBC_CEILING=2.39: the documented, deliberate floor decision for
      # this artifact -- see the job header.
      - name: Package the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          UR_APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime-${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          UR_GLIBC_CEILING: "2.39"
        run: |
          export STAGING_DIR="$PWD/staging" OUT_DIR="$PWD/dist"
          packaging/make-appimage.sh

      # Same lesson as the daemon payload check. `--appimage-extract` is a
      # builtin of the type2 runtime and needs no FUSE, so the contents can be
      # asserted on the runner. Named files, not just a count: the Windows
      # allowlist bug dropped Assets\Fonts while every count still looked fine.
      - name: Verify the AppImage payload
        working-directory: dist
        run: |
          appimage="URnetwork-${VERSION}-${{ matrix.arch }}.AppImage"
          [ -f "$appimage" ] || { echo "::error::$appimage was not produced"; exit 1; }
          [ -f "${appimage}.zsync" ] || { echo "::error::${appimage}.zsync was not produced -- the update channel needs it"; exit 1; }
          chmod +x "$appimage"
          ./"$appimage" --appimage-extract >/dev/null
          root=squashfs-root
          fail=0
          for want in \
            AppRun \
            network.ur.urnetwork.desktop \
            usr/bin/urnetwork-gui \
            usr/bin/gdk-pixbuf-query-loaders \
            usr/lib/urnetwork/libURnetworkSdk.so \
            usr/share/urnetwork/world-110m.json \
            usr/share/urnetwork/ReferralFrog.png \
            usr/share/urnetwork/fonts/abcgravity_extended.otf \
            usr/share/urnetwork/fonts/abcgravity_extra_condensed.otf \
            usr/share/urnetwork/fonts/pp_neue_bit_bold.ttf \
            usr/share/urnetwork/fonts/pp_neue_montreal_regular.ttf \
            usr/share/glib-2.0/schemas/gschemas.compiled ; do
            [ -e "$root/$want" ] || { echo "::error::$appimage is missing $want"; fail=1; }
          done
          # the bundled GTK4 stack, the tray art, the carousel and the catalogs
          # are globs
          [ -e "$root/usr/lib/libgtk-4.so.1" ] || { echo "::error::$appimage bundles no libgtk-4"; fail=1; }
          [ -e "$root/usr/lib/libadwaita-1.so.0" ] || { echo "::error::$appimage bundles no libadwaita"; fail=1; }
          [ -d "$root/usr/share/icons/Adwaita" ] || { echo "::error::$appimage bundles no Adwaita icon theme"; fail=1; }
          ls "$root"/usr/share/urnetwork/icons/*.png >/dev/null 2>&1 \
            || { echo "::error::$appimage carries no tray icons"; fail=1; }
          ls "$root"/usr/share/urnetwork/carousel/*.jpg >/dev/null 2>&1 \
            || { echo "::error::$appimage carries no login carousel art"; fail=1; }
          ls "$root"/usr/share/locale/*/LC_MESSAGES/urnetwork.mo >/dev/null 2>&1 \
            || { echo "::error::$appimage carries no gettext catalogs"; fail=1; }
          # the no-webkit rule, asserted on the shipped binary and not just on
          # the build host
          if readelf -d "$root/usr/bin/urnetwork-gui" | grep -qi webkit; then
            echo "::error::the bundled urnetwork-gui has a webkitgtk NEEDED entry"
            fail=1
          fi
          rm -rf "$root"
          exit $fail

      - name: Upload the AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-linux-appimage-${{ matrix.arch }}
          path: |
            dist/URnetwork-*.AppImage
            dist/URnetwork-*.AppImage.zsync
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # THE FLATPAK BUNDLE: the GUI a third time, for hosts that would rather
  # `flatpak install` than chmod +x an AppImage. GUI ONLY, for the reasons
  # packaging/flatpak/network.ur.urnetwork.yml sets out at length -- a sandbox
  # has no /dev/net/tun and cannot install a system unit, so this artifact
  # needs the daemon from the .rpm/.deb/tarball and says so when it is missing.
  #
  # WHY THIS JOB IS OPTIONAL AND DOES NOT BLOCK THE RELEASE
  #   The owner asked whether flatpak-builder is viable in Actions and to make
  #   it a separate optional job if it is too slow or unreliable. It is viable,
  #   and it is slow: this manifest builds libsigc++, glibmm, cairomm, pangomm,
  #   gtkmm, nlohmann-json and then the app, from source, inside the sandbox --
  #   gtkmm alone is the better part of ten minutes on a 4-core runner -- on
  #   top of a ~1.5 GB org.gnome.Sdk download. Expect 30-50 minutes against the
  #   ~15 the rest of the pipeline takes, and expect the source downloads
  #   (download.gnome.org, cairographics.org, github.com) to be a flake surface
  #   with no retry behind them, because flatpak-builder has none.
  #
  #   So the release job deliberately does NOT `needs:` this job. It publishes
  #   on the daemon + AppImage schedule it always has, and a SEPARATE
  #   release-flatpak job attaches the bundle to that already-published release
  #   a few minutes later. A broken or slow Flatpak therefore costs the Flatpak
  #   and nothing else: the tarball, the .deb, the .rpm and the AppImage ship
  #   exactly when they ship today.
  #
  #   It is NOT `continue-on-error`, though. A failure here should be visible
  #   as a red run so somebody looks at it; what it must not do is hold up or
  #   fail the release, and it cannot.
  #
  # WHY NOT flatpak/flatpak-github-actions
  #   That action runs flatpak-builder inside a prebuilt
  #   ghcr.io/flathub-infra/flatpak-github-actions:gnome-<N> image. It is the
  #   well-trodden path, but the image tag has to exist for the runtime this
  #   manifest pins (49), and if it does not the job dies at image pull for a
  #   reason that has nothing to do with this repo. Ubuntu 24.04's apt
  #   flatpak-builder is a package whose existence is not in question, so the
  #   only moving part left is Flathub itself.
  #
  # WHY THE BUILD RUNS UNDER sudo
  #   Two reasons, one of them the AppArmor risk the porting notes flag as the
  #   next SELinux. flatpak-builder drives bubblewrap, and Ubuntu 24.04 ships
  #   `kernel.apparmor_restrict_unprivileged_userns=1` with an AppArmor profile
  #   deciding which binaries may still create a user namespace -- exactly the
  #   MAC-layer refusal that put the daemon in init_t on Fedora. As root the
  #   question does not arise: the namespace is created with real privilege and
  #   no unprivileged-userns policy is consulted. Second, make-flatpak.sh calls
  #   `flatpak install` with no --user, which targets the SYSTEM installation;
  #   as a non-root user with no polkit agent on the runner that is a hang or a
  #   refusal, not an install.
  #
  #   `sudo env VAR=... script`, never `sudo -E`: -E depends on a SETENV tag in
  #   sudoers that this workflow should not assume.
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Build GUI Flatpak bundle (${{ matrix.arch }})
    needs: build-sdk
    # The kill switch. A job-level `if:` can read github/needs/vars/inputs but
    # NOT `env`, so this one knob lives as a repository variable rather than
    # beside UR_REQUIRE_RPM at the top of the file: set UR_BUILD_FLATPAK to
    # "false" in the repo's variables to skip the Flatpak entirely, with no
    # commit. Unset means build (the intended state).
    if: vars.UR_BUILD_FLATPAK != 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.build-sdk.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out Linux repo
        uses: actions/checkout@v4

      # Into RUNNER_TEMP, not the workspace, unlike every other job here. The
      # manifest's app module is `type: dir, path: ../..`, i.e. flatpak-builder
      # copies the ENTIRE repo tree into the build -- so anything dropped in
      # the workspace is paid for on every module build. The vendored SDK has
      # to be in there (the meson build links it); a 30 MB zip does not.
      - name: Download the SDK zip
        uses: actions/download-artifact@v4
        with:
          name: urnetwork-sdk-linux
          path: ${{ runner.temp }}/sdk-zip

      # binutils for `strings` (the version-stamp assertion below reads the
      # built binary). Everything else the GUI needs is inside org.gnome.Sdk --
      # that is the entire point of building in a runtime.
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          # elfutils is NOT optional despite nothing naming it: flatpak-builder
          # strips every module it builds by shelling out to `eu-strip`, which
          # ships in elfutils and is NOT pulled in by the flatpak-builder
          # package. Without it the build dies partway through the dependency
          # stack -- "module libsigc++: Failed to execute child process
          # eu-strip (No such file or directory)" -- after several minutes of
          # apparently healthy compiling, which reads like a compiler problem
          # rather than a missing tool. binutils alone does not provide it.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder binutils elfutils
          flatpak --version
          flatpak-builder --version
          command -v eu-strip >/dev/null || { echo "::error::eu-strip missing after installing elfutils"; exit 1; }

      # Pre-warmed here rather than left to make-flatpak.sh so the download is
      # a step that can retry and that shows its own timing, instead of silence
      # inside the build step. The script's own `flatpak install` then finds
      # both refs present and is a no-op.
      - name: Add flathub and install the GNOME runtime + SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          ok=0
          for attempt in 1 2 3; do
            if sudo flatpak install -y --noninteractive flathub \
                 "org.gnome.Platform//${UR_FLATPAK_RUNTIME}" \
                 "org.gnome.Sdk//${UR_FLATPAK_RUNTIME}"; then
              ok=1; break
            fi
            echo "::warning::flatpak install attempt ${attempt} failed -- retrying"
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::could not install org.gnome.Platform//${UR_FLATPAK_RUNTIME} + org.gnome.Sdk//${UR_FLATPAK_RUNTIME} from flathub after 3 attempts"; exit 1; }
          # assert rather than trust: a partial install is a build failure 40
          # minutes later otherwise
          flatpak info "org.gnome.Platform//${UR_FLATPAK_RUNTIME}" >/dev/null
          flatpak info "org.gnome.Sdk//${UR_FLATPAK_RUNTIME}" >/dev/null
          flatpak list --columns=application,branch,installation

      - name: Vendor the SDK into third_party
        run: app/scripts/fetch-deps.sh "$RUNNER_TEMP/sdk-zip/URnetworkSdkLinux.zip"

      # TWO CI-ONLY EDITS TO THE CHECKED-OUT MANIFEST. The workspace copy is
      # disposable and nothing is committed back, so editing it in place is
      # safe -- and it is the only safe way: the app module's source is
      # `type: dir, path: ../..`, resolved relative to the MANIFEST, so a
      # rendered copy anywhere else would silently point at the wrong tree.
      #
      # 1. -Dapp_version. The manifest does not pass it, so the Flatpak GUI
      #    would compile with meson's dev sentinel 0.0.0 and report that as its
      #    app_version forever. That is not cosmetic: the GUI compares its own
      #    version against the daemon's `hello` reply and renders "app out of
      #    date" / "builds differ" from the comparison, so a 0.0.0 Flatpak sits
      #    permanently in an error state against a correctly-versioned daemon.
      #    The .deb, the tarball and the AppImage all get -Dapp_version from
      #    their meson setup lines; this closes the one gap.
      # 2. Nothing else. The runtime version is only ASSERTED, never rewritten:
      #    if the manifest and UR_FLATPAK_RUNTIME disagree, the pre-warm above
      #    installed a runtime this build will not use, and quietly patching
      #    the manifest to match CI would be the wrong half to move.
      #
      # TODO(packaging): both of these belong upstream -- make-flatpak.sh
      # already reads VERSION for the bundle filename, so threading it into the
      # meson config-opts (or adding -Dapp_version to the manifest with a
      # placeholder the script substitutes) would delete this step.
      - name: Stamp the version into the manifest (CI-only)
        run: |
          manifest=packaging/flatpak/network.ur.urnetwork.yml
          if ! grep -qx "runtime-version: '${UR_FLATPAK_RUNTIME}'" "$manifest"; then
            echo "::error::$manifest does not declare runtime-version '${UR_FLATPAK_RUNTIME}'. UR_FLATPAK_RUNTIME (this workflow) and the manifest must name the same GNOME runtime -- the pre-warm step installed the wrong one."
            grep -n 'runtime-version' "$manifest" || true
            exit 1
          fi
          anchor='      - -Dhost_integration=false'
          if ! grep -qxF "$anchor" "$manifest"; then
            echo "::error::the app module's config-opts anchor ('-Dhost_integration=false') is gone from $manifest, so this step cannot stamp -Dapp_version and the bundle would ship reporting 0.0.0. Add -Dapp_version to the manifest (or to make-flatpak.sh) and delete this step."
            exit 1
          fi
          sed -i "s|^${anchor}\$|${anchor}\n      - -Dapp_version=${VERSION}|" "$manifest"
          grep -qxF "      - -Dapp_version=${VERSION}" "$manifest" \
            || { echo "::error::failed to stamp -Dapp_version=${VERSION} into $manifest"; exit 1; }
          echo "stamped -Dapp_version=${VERSION}"
          sed -n '/name: urnetwork/,$p' "$manifest"

      # BUILD_DIR is moved OUT of the repo, which contradicts make-flatpak.sh's
      # own comment -- deliberately, and only because this job is the case that
      # comment excludes. It says the build dir must live inside the repo
      # because flatpak-builder runs as the org.flatpak.Builder FLATPAK, which
      # gets a private /tmp; here flatpak-builder is a native apt binary in the
      # `command -v flatpak-builder` branch, with no sandbox and no private
      # /tmp. Keeping it in-tree instead would feed build-flatpak/ (every
      # unpacked gtkmm tarball in it) back into the app module's own
      # `type: dir, path: ../..` copy on the next module build.
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo env \
            "VERSION=${VERSION}" \
            "OUT_DIR=${PWD}/dist" \
            "BUILD_DIR=${RUNNER_TEMP}/build-flatpak" \
            "RUNTIME_VERSION=${UR_FLATPAK_RUNTIME}" \
            packaging/make-flatpak.sh --bundle
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist

      # make-flatpak.sh writes URnetwork-<version>.flatpak with NO arch in the
      # name -- the one asset name in this pipeline that does not carry one.
      # Renamed here so it matches its four siblings, and because the moment
      # the arm64 legs are uncommented the two jobs would produce the SAME
      # filename and `merge-multiple: true` would have one silently overwrite
      # the other in the release.
      #
      # TODO(packaging): this rename belongs in make-flatpak.sh, which already
      # knows VERSION and would only need ARCH. The rule everywhere else in
      # this file is that the script names the artifact and the workflow only
      # asserts; this step is a knowing, temporary exception, so move it and
      # delete this step rather than letting the two drift.
      - name: Name the bundle for the release
        env:
          ARCH: ${{ matrix.arch }}
        working-directory: dist
        run: |
          built="URnetwork-${VERSION}.flatpak"
          final="URnetwork-${VERSION}-${ARCH}.flatpak"
          [ -f "$built" ] || { echo "::error::make-flatpak.sh --bundle did not produce $built"; ls -la; exit 1; }
          mv "$built" "$final"
          # a bundle carrying only metadata would still be a file; the gtkmm
          # stack plus the app is tens of MB even compressed
          size=$(stat -c %s "$final")
          echo "$final: $size bytes"
          [ "$size" -ge 5000000 ] || { echo "::error::$final is only $size bytes -- implausibly small for the bundled gtkmm stack"; exit 1; }

      # The same lesson as the AppImage and the .deb: assert what is INSIDE.
      # A bundle is an ostree static delta and cannot be listed with tar, so
      # this installs it -- which is also the only check that proves the thing
      # a user will actually run installs at all, and it costs seconds because
      # the runtime is already local.
      - name: Verify the bundle payload
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="$PWD/dist/URnetwork-${VERSION}-${ARCH}.flatpak"
          sudo flatpak install -y --noninteractive --bundle "$bundle"
          loc=$(flatpak info -l network.ur.urnetwork)
          echo "deployed at: $loc"
          fail=0
          for want in \
            files/bin/urnetwork-gui \
            files/share/urnetwork/world-110m.json \
            files/share/applications/network.ur.urnetwork.desktop \
            metadata ; do
            [ -e "$loc/$want" ] || { echo "::error::the bundle is missing $want"; fail=1; }
          done
          # The two libraries are looked up with `find`, not a fixed path:
          # meson's libdir default is decided by the BUILD environment (plain
          # lib on the freedesktop-based GNOME SDK, lib/<triplet> on a Debian
          # host, lib64 elsewhere), and this assertion must survive that
          # choice rather than encode one guess about it.
          [ -n "$(find "$loc/files" -name 'libURnetworkSdk.so' -print -quit)" ] \
            || { echo "::error::the bundle carries no libURnetworkSdk.so -- -Dhost_integration=false did not relocate the vendored SDK into the app tree"; fail=1; }
          [ -n "$(find "$loc/files" -name 'libgtkmm-4*.so*' -print -quit)" ] \
            || { echo "::error::the bundle carries no gtkmm -- the manifest's C++ binding modules did not install"; fail=1; }
          ls "$loc"/files/share/urnetwork/fonts/* >/dev/null 2>&1 \
            || { echo "::error::the bundle carries no brand fonts"; fail=1; }
          ls "$loc"/files/share/urnetwork/icons/*.png >/dev/null 2>&1 \
            || { echo "::error::the bundle carries no tray icons"; fail=1; }
          ls "$loc"/files/share/locale/*/LC_MESSAGES/urnetwork.mo >/dev/null 2>&1 \
            || { echo "::error::the bundle carries no gettext catalogs"; fail=1; }

          # THE SANDBOX PERMISSIONS ARE PART OF THE ARTIFACT. Without the
          # control socket the GUI installs, launches, and can never reach the
          # host daemon -- it renders "service not running" forever, which is
          # indistinguishable to a user from a broken daemon. finish-args are
          # easy to lose in a manifest edit and impossible to notice by looking
          # at the file list, so assert them on the built metadata.
          echo "--- metadata ---"; cat "$loc/metadata"; echo "----------------"
          grep -q '/run/urnetwork:ro' "$loc/metadata" \
            || { echo "::error::the bundle's metadata does not expose /run/urnetwork:ro -- the GUI could never reach the host daemon"; fail=1; }
          grep -q 'org.kde.StatusNotifierWatcher' "$loc/metadata" \
            || { echo "::error::the bundle's metadata does not talk to org.kde.StatusNotifierWatcher -- no tray"; fail=1; }
          grep -q "runtime=org.gnome.Platform/[^/]*/${UR_FLATPAK_RUNTIME}\$" "$loc/metadata" \
            || { echo "::error::the bundle does not target org.gnome.Platform//${UR_FLATPAK_RUNTIME}"; fail=1; }

          # the manifest's post-install rewrites Exec away from the daemon
          # package's /usr/bin/urnetwork launcher, which does not exist in a
          # sandbox. (Check the module's own copy, not export/: flatpak
          # rewrites Exec in the exported entry to `flatpak run ...`.)
          grep -q '^Exec=urnetwork-gui' "$loc/files/share/applications/network.ur.urnetwork.desktop" \
            || { echo "::error::the bundled .desktop still points Exec at the host launcher -- the manifest's post-install desktop-file-edit did not run"; fail=1; }

          # the version actually compiled in -- this is what the CI-only
          # manifest stamp above exists to guarantee, so prove it on the binary
          # rather than trusting the sed
          if ! strings -a "$loc/files/bin/urnetwork-gui" | grep -qF "$VERSION"; then
            echo "::error::the bundled urnetwork-gui does not contain the string ${VERSION} -- -Dapp_version did not reach the build, so this Flatpak would report 0.0.0 and sit in the GUI's version-skew error state"
            fail=1
          fi
          sudo flatpak uninstall -y --noninteractive network.ur.urnetwork >/dev/null 2>&1 || true
          exit $fail

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-linux-flatpak-${{ matrix.arch }}
          path: dist/URnetwork-*.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Every green push publishes a prerelease, the way the windows and android
  # forks do: same tag grammar, same riding-the-numbering notes line. The
  # in-app service installer and the GUI updater poll this repo's releases, so
  # the asset names attached here are the contract stated at the top of this
  # file. No checksums file is attached -- verification rides the per-asset
  # sha256 digest GitHub computes on upload and serves in the same releases
  # JSON the checker already fetches.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the prerelease
    # PRs build everything but must not publish: a PR that republished (and
    # first DELETED) the day's release would be a footgun even before fork
    # PRs' read-only tokens made it fail halfway.
    if: github.event_name != 'pull_request'
    needs: [build-sdk, build-daemon, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-sdk.outputs.version }}
    steps:
      # gh resolves which repo to release into from the checkout's remote
      - name: Check out Linux repo
        uses: actions/checkout@v4

      - name: Download the daemon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: urnetwork-linux-daemon-*
          path: dist
          merge-multiple: true

      - name: Download the AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: urnetwork-linux-appimage-*
          path: dist
          merge-multiple: true

      # Assert the asset set BEFORE touching the existing release. The release
      # job deletes first and creates second; discovering a missing asset after
      # the delete would leave the tag with no release at all.
      - name: Assert the asset-name contract
        working-directory: dist
        run: |
          shopt -s nullglob
          tarballs=(urnetwork-daemon-*.install.tar.gz)
          debs=(urnetwork-daemon_*.deb)
          # binary rpms only -- see the same filter in the daemon job
          rpms=()
          for f in urnetwork-daemon[-_]*.rpm; do
            case "$f" in *.src.rpm) continue ;; esac
            rpms+=("$f")
          done
          appimages=(URnetwork-*.AppImage)
          zsyncs=(URnetwork-*.AppImage.zsync)
          fail=0
          [ "${#tarballs[@]}"  -ge 1 ] || { echo "::error::no urnetwork-daemon-<version>-<arch>.install.tar.gz -- this is the asset the in-app service installer downloads"; fail=1; }
          [ "${#debs[@]}"      -ge 1 ] || { echo "::error::no urnetwork-daemon_<version>_<arch>.deb"; fail=1; }
          [ "${#appimages[@]}" -ge 1 ] || { echo "::error::no URnetwork-<version>-<arch>.AppImage"; fail=1; }
          [ "${#zsyncs[@]}"    -ge 1 ] || { echo "::error::no URnetwork-<version>-<arch>.AppImage.zsync"; fail=1; }
          if [ "${#rpms[@]}" -lt 1 ]; then
            if [ "${UR_REQUIRE_RPM}" = "true" ]; then
              echo "::error::no urnetwork-daemon*.rpm -- the rpm is the Fedora/RHEL/openSUSE half of the native-package channel and this release requires it (UR_REQUIRE_RPM)"
              fail=1
            else
              echo "::warning::no .rpm in this release and UR_REQUIRE_RPM is not \"true\""
            fi
          fi
          # every asset must carry THIS run's version, or the in-app checker
          # would rank a stale artifact under a fresh tag
          for f in "${tarballs[@]}" "${debs[@]}" "${appimages[@]}" "${zsyncs[@]}"; do
            case "$f" in
              *"${VERSION}"*) ;;
              *) echo "::error::$f does not carry version ${VERSION}"; fail=1 ;;
            esac
          done
          # THE RPM IS CHECKED ON TOKENS, not on the literal version, and the
          # reason is rpm's, not ours: '-' is forbidden in both Version and
          # Release, so "2026.8.16-1020679030-beta" CANNOT appear verbatim in a
          # legal rpm filename. The date and the beta code survive every legal
          # mangling of it, and the beta code is the part that makes an
          # artifact unique to this run -- which is the whole property this
          # loop protects. See the asset-name contract at the top of the file.
          ver_date="${VERSION%%-*}"
          ver_rest="${VERSION#*-}"
          ver_code="${ver_rest%%-*}"
          for f in "${rpms[@]}"; do
            for tok in "$ver_date" "$ver_code"; do
              case "$f" in
                *"$tok"*) ;;
                *) echo "::error::$f does not carry version token '$tok' from ${VERSION}"; fail=1 ;;
              esac
            done
          done
          # one AppImage per zsync, one deb per tarball, one rpm per deb -- an
          # arch that built only half its set must not reach a release
          [ "${#appimages[@]}" -eq "${#zsyncs[@]}" ] || { echo "::error::AppImage/zsync count mismatch"; fail=1; }
          [ "${#tarballs[@]}"  -eq "${#debs[@]}" ]   || { echo "::error::tarball/deb count mismatch"; fail=1; }
          if [ "${#rpms[@]}" -ge 1 ] && [ "${#rpms[@]}" -ne "${#debs[@]}" ]; then
            echo "::error::rpm/deb count mismatch (${#rpms[@]} vs ${#debs[@]}) -- an arch produced one native package but not the other"
            fail=1
          fi
          # The .flatpak is deliberately absent from every check here: it is
          # attached by the release-flatpak job AFTER this one, from a build
          # that is allowed to be slower or to fail. Requiring it would hand
          # the optional artifact a veto over the required ones.
          ls -la
          exit $fail

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${VERSION}"
          # re-running a run (or a same-day rebuild racing the date math)
          # must replace the tag's release, not collide with it
          gh release delete "$tag" --yes || true
          {
            echo "Beta build (custom server fork) riding the official version numbering -- this is not an official URnetwork release."
            echo
            echo "**The service and the UI are separate downloads.** The AppImage (and the Flatpak) ship the UI only; the privileged service is the \`.install.tar.gz\` below, which the app itself downloads, verifies and installs behind a single polkit prompt."
            echo
            echo "| asset | what it is |"
            echo "| --- | --- |"
            echo "| \`urnetwork-daemon-<version>-<arch>.install.tar.gz\` | the privileged service; \`tar xz && sudo urnetwork-daemon/install.sh\` |"
            echo "| \`urnetwork-daemon_<version>_<arch>.deb\` | the same service as a native package (Debian/Ubuntu) |"
            echo "| \`urnetwork-daemon-<version>.<arch>.rpm\` | the same service as a native package (Fedora/RHEL/openSUSE) |"
            echo "| \`URnetwork-<version>-<arch>.AppImage\` | the GUI, unprivileged |"
            echo "| \`URnetwork-<version>-<arch>.AppImage.zsync\` | zsync control file (GitHub answers zsync's range requests with HTTP 501 -- the working mirror is get.ur.network) |"
            echo "| \`URnetwork-<version>-<arch>.flatpak\` | the GUI as a Flatpak bundle: \`flatpak install --user <file>\`. Still needs the service from one of the packages above. Built by a separate, slower job -- if it is not attached yet, it is still building, and if it never appears that build failed while this release did not. |"
            echo
            echo "The three daemon packages are the SAME payload: one \`meson install\` tree, one assembly function, three wrappers. Pick whichever your distro speaks."
            echo
            echo "Asset names are a contract: the in-app installer and updater parse them and verify each download against the sha256 digest GitHub publishes for that same asset. There is deliberately no SHA256SUMS file."
            echo
            echo "Daemon glibc floor: 2.35 (built on Ubuntu 22.04), for the tarball, the .deb and the .rpm alike. AppImage glibc floor: 2.39 (built on Ubuntu 24.04). The Flatpak has no host glibc floor -- it runs against org.gnome.Platform."
            echo
            echo "Unsigned. Detached signatures are not produced by CI yet."
          } > notes.md
          # nullglob, because the rpm is allowed to be absent when
          # UR_REQUIRE_RPM is not "true": without it bash would hand gh an
          # unexpanded pattern as a literal filename and the upload would fail
          # with the release ALREADY DELETED. The assert step above is what
          # guarantees the required assets are present.
          shopt -s nullglob
          files=(
            urnetwork-daemon-*.install.tar.gz
            urnetwork-daemon_*.deb
            URnetwork-*.AppImage
            URnetwork-*.AppImage.zsync
          )
          # The rpm is appended rather than globbed inline: make-rpm.sh may
          # separate name from version with '-' or '_', and a .src.rpm (if it
          # ever emits one) is not part of the asset contract.
          for f in urnetwork-daemon[-_]*.rpm; do
            case "$f" in *.src.rpm) continue ;; esac
            files+=("$f")
          done
          # --target pins the tag to the commit this run built; without it a
          # new tag would point wherever the default branch happens to be
          gh release create "$tag" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            "${files[@]}"

  # ---------------------------------------------------------------------------
  # The Flatpak bundle rides in after the fact, onto the release the job above
  # has already published.
  #
  # THIS IS THE WHOLE POINT OF SPLITTING IT OUT. The Flatpak build is 30-50
  # minutes against the pipeline's ~15 (it compiles the entire gtkmm stack from
  # source inside the runtime -- see the build-flatpak header). Folding it into
  # `release`'s needs: would have delayed the tarball, the .deb, the .rpm and
  # the AppImage by half an hour on every single push, to ship one optional
  # GUI channel at the same instant as the rest. Attaching it separately costs
  # only that the release is briefly missing one asset, which the notes say
  # out loud.
  #
  # It cannot resurrect a failed release: it `needs: release`, and a needed job
  # that failed or was skipped skips this one too. If build-flatpak fails, or
  # is switched off with the UR_BUILD_FLATPAK repo variable, this job simply
  # never runs and the release stands as published.
  #
  # --clobber, because a re-run of the same tag republishes the release and
  # this job then has to overwrite its own earlier upload rather than collide
  # with it -- the same replace-don't-collide rule `gh release delete` gives
  # the job above.
  # ---------------------------------------------------------------------------
  release-flatpak:
    name: Attach the Flatpak bundle to the prerelease
    if: github.event_name != 'pull_request'
    needs: [build-sdk, build-flatpak, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-sdk.outputs.version }}
    steps:
      # gh resolves which repo to release into from the checkout's remote
      - name: Check out Linux repo
        uses: actions/checkout@v4

      - name: Download the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          pattern: urnetwork-linux-flatpak-*
          path: dist
          merge-multiple: true

      # No `working-directory: dist` here on purpose: if the download matched
      # nothing, that directory may not exist and the step would die with a
      # bare "no such file or directory" before any of the assertions below
      # could name what is actually wrong.
      - name: Attach the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          cd dist 2>/dev/null || { echo "::error::no dist/ -- the flatpak artifact did not download"; exit 1; }
          bundles=(URnetwork-*.flatpak)
          if [ "${#bundles[@]}" -lt 1 ]; then
            echo "::error::build-flatpak succeeded but produced no URnetwork-*.flatpak artifact"
            exit 1
          fi
          fail=0
          for f in "${bundles[@]}"; do
            case "$f" in
              *"${VERSION}"*) ;;
              *) echo "::error::$f does not carry version ${VERSION}"; fail=1 ;;
            esac
          done
          [ "$fail" = 0 ] || exit 1
          ls -la
          # The release must already exist -- this job needs: release. If it
          # somehow does not, fail here rather than creating a second,
          # notes-less release under the same tag.
          tag="v${VERSION}"
          gh release view "$tag" >/dev/null \
            || { echo "::error::release $tag does not exist -- nothing to attach the bundle to"; exit 1; }
          gh release upload "$tag" --clobber "${bundles[@]}"
