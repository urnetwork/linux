# Keep NetworkManager off the URnetwork tun (MIGRATION.md table).
#
# NM protects an externally created device only while the link is DOWN
# (nm-device.c _dev_unmanaged_is_external_down), and the daemon runs
# `ip link set urnet0 up` -- so this marking must be in place BEFORE the
# first tunnel comes up. [keyfile] unmanaged-devices is authoritative and
# cannot be overruled by later automatic management (APPIMAGE.md 10c).
#
# Ubuntu's 10-globally-managed-devices.conf looks like it would already cover
# this, but something on Ubuntu Desktop demonstrably shadows it and which
# component is not established -- so we ship our own marking regardless.
[keyfile]
unmanaged-devices=interface-name:urnet0
